name: reusable-ci-checks

# Reusable workflow: all source-level quality + security gates.
# Called by pr-validation.yaml (on PRs) and release.yaml (on push to main),
# so the exact same checks gate every merge and every release.

on:
  workflow_call:
    inputs:
      go-version:
        description: Go toolchain version
        type: string
        default: "1.24"

permissions:
  contents: read

jobs:
  test:
    name: lint / vet / test / vuln
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ inputs.go-version }}
          cache: true

      - name: Download modules
        run: go mod download

      - name: Verify module checksums
        run: go mod verify

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::The following files are not gofmt-ed:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9.2.1
        with:
          version: latest

      - name: Unit tests (race detector + coverage)
        run: go test ./... -race -covermode=atomic -coverprofile=coverage.out

      - name: govulncheck (Go-aware CVE detection)
        continue-on-error: true # report vulnerabilities without failing the build (temporary)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

  security:
    name: SAST / secrets / dependency scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload SARIF to the GitHub Security tab
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # gitleaks needs full history to scan all commits

      - name: Trivy filesystem scan (deps + IaC, blocking)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload Trivy SARIF
        if: always() # still publish findings even when the scan failed the job
        continue-on-error: true # forked-PR tokens cannot upload; don't break the run
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

      - name: Semgrep SAST (report-only)
        continue-on-error: true # surface findings without blocking merges initially
        run: |
          python3 -m pip install --quiet semgrep
          semgrep scan --config auto --sarif --output semgrep.sarif

      - name: Upload Semgrep SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }} # required only for private repos in a GitHub org
