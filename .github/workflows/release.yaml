name: release

# Runs only on push to main (i.e. after a PR merges).
# Re-runs the full CI gate, builds + signs the immutable artifact, then
# auto-deploys to STAGING via GitOps (commit to the config repo). It never
# touches production: promotion is a separate, gated workflow (promote.yaml).

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci-checks:
    name: ci-checks
    uses: ./.github/workflows/reusable-ci-checks.yaml
    permissions:
      contents: read
      security-events: write

  version:
    name: compute-version
    runs-on: ubuntu-latest
    needs: ci-checks
    outputs:
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Compute version tag
        id: v
        run: |
          short="$(git rev-parse --short=7 HEAD)"
          base="$(git describe --tags --abbrev=0 2>/dev/null || echo v0.0.0)"
          echo "tag=${base}-${short}" >> "$GITHUB_OUTPUT"

  build-sign:
    name: build-sign
    needs: version
    uses: ./.github/workflows/reusable-build-sign.yaml
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      push: true
      image-tag: ${{ needs.version.outputs.tag }}
    secrets: inherit

  deploy-staging:
    name: deploy-staging
    needs: [version, build-sign]
    runs-on: ubuntu-latest
    environment:
      name: staging
    steps:
      - name: Checkout GitOps repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ secrets.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_PAT }}

      - name: Pin new image (tag + digest) in staging overlay
        working-directory: apps/worlddatetime/overlays/stage
        run: |
          new="worlddatetime:${{ needs.version.outputs.tag }}@${{ needs.build-sign.outputs.digest }}"
          sed -i "s#worlddatetime:.*#${new}#" image.yaml
          echo "Pinned staging to ${new}"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No image change to commit."
            exit 0
          fi
          git commit -m "ci(worlddatetime): deploy ${{ needs.version.outputs.tag }} to staging"
          git push

  summary:
    name: promotion-instructions
    needs: [version, build-sign, deploy-staging]
    runs-on: ubuntu-latest
    steps:
      - name: Print promotion command
        run: |
          {
            echo "## worlddatetime ${{ needs.version.outputs.tag }} staged"
            echo ""
            echo "Image digest: \`${{ needs.build-sign.outputs.digest }}\`"
            echo ""
            echo "Promote to production with:"
            echo '```'
            echo "gh workflow run promote.yaml \\"
            echo "  -f image_tag=${{ needs.version.outputs.tag }} \\"
            echo "  -f image_digest=${{ needs.build-sign.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
