name: promote-production

# Promotes an ALREADY-built, ALREADY-staged, signed image to production.
# Nothing is rebuilt: the exact same digest moves from staging -> production
# ("build once, promote the artifact"). Manually triggered and gated by the
# `production` environment; the change lands as an approved PR in the GitOps repo.

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to promote (e.g. v0.0.0-abc1234)
        required: true
        type: string
      image_digest:
        description: Image digest of the staged image (sha256:...)
        required: true
        type: string

permissions:
  contents: read

jobs:
  open-promotion-pr:
    name: open-promotion-pr
    runs-on: ubuntu-latest
    environment:
      name: production # required reviewers here gate the promotion
    steps:
      - name: Validate digest format
        run: |
          case "${{ inputs.image_digest }}" in
            sha256:*) : ;;
            *) echo "::error::image_digest must start with sha256:"; exit 1 ;;
          esac

      - name: Checkout GitOps repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ secrets.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_PAT }}

      - name: Pin image (tag + digest) in production overlay
        working-directory: apps/worlddatetime/overlays/prod
        run: |
          new="worlddatetime:${{ inputs.image_tag }}@${{ inputs.image_digest }}"
          sed -i "s#worlddatetime:.*#${new}#" image.yaml
          echo "Pinned production to ${new}"

      - name: Open promotion pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITOPS_PAT }}
          branch: promote/worlddatetime-${{ inputs.image_tag }}
          delete-branch: true
          title: "Promote worlddatetime ${{ inputs.image_tag }} to production"
          commit-message: "cd(worlddatetime): promote ${{ inputs.image_tag }} to production"
          body: |
            Promotes the already-staged, signed image to production.

            - **Tag:** `${{ inputs.image_tag }}`
            - **Digest:** `${{ inputs.image_digest }}`

            The image is unchanged from staging (same digest). Merging this PR lets
            Argo CD reconcile the production overlay.
