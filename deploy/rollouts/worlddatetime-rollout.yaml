# Argo Rollouts canary for progressive delivery with automated, metric-based
# rollback. This replaces a plain Deployment in your GitOps overlays. The image
# line is what your release.yaml / promote.yaml pins (tag@sha256:digest).
#
# Requires the Argo Rollouts controller installed in the cluster.
# Docs: https://argo-rollouts.readthedocs.io/
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: worlddatetime
spec:
  replicas: 3
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: worlddatetime
  template:
    metadata:
      labels:
        app: worlddatetime
    spec:
      containers:
        - name: worlddatetime
          # Pinned by release.yaml / promote.yaml. Example shape:
          # REGION-docker.pkg.dev/PROJECT/REPO/worlddatetime:v0.0.0-abc1234@sha256:...
          image: REGION-docker.pkg.dev/PROJECT/REPO/worlddatetime:latest
          ports:
            - containerPort: 8080
          env:
            - name: VERSION
              value: "v0.0.0" # set per-overlay so /metrics gtod_build_info is accurate
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
  strategy:
    canary:
      steps:
        - setWeight: 5
        - pause: { duration: 2m }
        - analysis:
            templates:
              - templateName: worlddatetime-success-rate
        - setWeight: 25
        - pause: { duration: 5m }
        - setWeight: 50
        - pause: { duration: 5m }
        - setWeight: 100
---
# Analysis gate: query Prometheus for the service's own RED metrics and abort
# (auto-rollback) the canary if the success rate drops below 99%.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: worlddatetime-success-rate
spec:
  metrics:
    - name: success-rate
      interval: 1m
      count: 5
      successCondition: result[0] >= 0.99
      failureLimit: 1
      provider:
        prometheus:
          address: http://prometheus.monitoring.svc:9090
          query: |
            sum(rate(http_requests_total{route!="",status_class!="5xx"}[2m]))
            /
            sum(rate(http_requests_total{route!=""}[2m]))
